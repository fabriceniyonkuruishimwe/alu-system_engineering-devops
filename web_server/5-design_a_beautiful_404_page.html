<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Ceci n'est pas une page</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: Georgia, "Times New Roman", serif;
    color: #f5f0e6;
    background: radial-gradient(circle at 50% 30%, #2b2d6e, #0b0c24 70%);
    overflow: hidden;
  }
  .stars, .stars::after {
    content: "";
    position: absolute;
    width: 3px; height: 3px;
    background: transparent;
    box-shadow: 10vw 20vh #fff, 25vw 70vh #fff, 40vw 15vh #fff, 55vw 80vh #fff,
                70vw 35vh #fff, 85vw 60vh #fff, 92vw 10vh #fff, 15vw 90vh #fff,
                60vw 50vh #fff, 33vw 45vh #fff, 78vw 85vh #fff, 5vw 55vh #fff;
    animation: twinkle 3s ease-in-out infinite alternate;
  }
  .stars::after { top: 7vh; left: 9vw; animation-delay: 1.5s; }
  @keyframes twinkle { from { opacity: .2; } to { opacity: 1; } }
  main { position: relative; padding: 2rem; z-index: 1; }
  .code {
    font-size: clamp(6rem, 25vw, 14rem);
    font-weight: bold;
    line-height: 1;
    background: linear-gradient(90deg, #ff9a8b, #ffd36e, #8be9fd);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float { 50% { transform: translateY(-14px); } }
  h1 { font-size: clamp(1.4rem, 4vw, 2.4rem); margin: 1rem 0 .5rem; font-style: italic; }
  p { opacity: .8; margin-bottom: 2rem; font-size: 1.1rem; }
  a {
    display: inline-block;
    padding: .8rem 2rem;
    border-radius: 999px;
    background: #ffd36e;
    color: #1a1a3a;
    text-decoration: none;
    font-weight: bold;
    transition: transform .2s, box-shadow .2s;
  }
  a:hover { transform: scale(1.06); box-shadow: 0 0 20px #ffd36e; }
</style>
</head>
<body>
  <div class="stars"></div>
  <main>
    <div class="code">404</div>
    <h1>Ceci n'est pas une page</h1>
    <p>The page you are looking for drifted off into space.</p>
    <a href="/">Take me home</a>
  </main>
</body>
</html>
